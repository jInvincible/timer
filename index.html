<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lander Timer Web v7.28</title>
  <!-- Firebase SDK v9 Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-color: #0b1120;
      --surface-color: #151f32;
      --surface-hover: #1e2b45;
      --border-color: #293854;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --success-color: #22c55e;
      --warning-color: #f59e0b;
      --expired-bg: rgba(239, 68, 68, 0.15);
      --expired-border: #ef4444;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --surface-color: #ffffff;
      --surface-hover: #f8fafc;
      --border-color: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #dc2626;
      --danger-hover: #b91c1c;
      --success-color: #16a34a;
      --warning-color: #d97706;
      --expired-bg: rgba(220, 38, 38, 0.08);
      --expired-border: #dc2626;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 14px 18px 80px;
      transition: background-color 0.2s, color 0.2s;
      user-select: none;
    }

    /* Header & Toolbar */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-section {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .version-badge {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent-color);
      background: rgba(56, 189, 248, 0.14);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .clock-display {
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    button {
      background-color: var(--surface-color);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    button:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent-color);
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    button.primary:hover {
      background-color: var(--accent-hover);
    }

    button.danger {
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.45);
    }

    button.danger:hover {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    button.admin-unlocked {
      border-color: var(--success-color);
      color: var(--success-color);
    }

    input:disabled {
      opacity: 0.52;
      cursor: not-allowed;
      background-color: rgba(15, 23, 42, 0.55);
    }

    /* Config Drawer */
    .config-panel {
      display: none;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .config-panel.open {
      display: block;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    .config-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-item label {
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .config-item input {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      user-select: text;
    }

    .config-footer {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .paste-hint {
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    /* Timeline Section */
    .timeline-wrapper {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 9px;
      padding: 10px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .timeline-range-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.74rem;
    }

    .timeline-range-control input[type="number"] {
      width: 68px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
      user-select: text;
    }

    .timeline-range-control input[type="number"]:focus {
      outline: none;
      border-color: var(--accent-color);
    }


    .timeline-viewport {
      position: relative;
      width: 100%;
      height: 108px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 7px;
      overflow: hidden;
      cursor: grab;
    }

    .timeline-viewport:active {
      cursor: grabbing;
    }

    .now-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--danger-color);
      z-index: 15;
      pointer-events: none;
    }

    .now-marker::after {
      content: "NOW";
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 0.64rem;
      font-weight: 800;
      color: var(--danger-color);
    }

    /* Vertical Dot Line aligned with the left edge of Boss node box */
    .vertical-dot-line {
      position: absolute;
      bottom: 0;
      width: 0;
      border-left: 1.5px dashed rgba(56, 189, 248, 0.72);
      z-index: 6;
      pointer-events: none;
    }

    .vertical-dot-line.tier-1-line {
      height: 54px; /* Từ đáy viewport lên sát đáy node tầng 1 */
    }

    .vertical-dot-line.tier-2-line {
      height: 66px; /* Kéo cao tới đáy node tầng 2 */
    }

    .vertical-dot-line.overdue-line {
      border-left-color: rgba(148, 163, 184, 0.45);
    }

    /* 2-Tier Boss Name Nodes on Timeline */
    .timeline-node {
      position: absolute;
      top: 44px; /* Tầng 1: vị trí bình thường */
      background-color: var(--surface-color);
      border: 1px solid var(--accent-color);
      color: var(--text-primary);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
    }

    .timeline-node.tier-2 {
      top: 8px; /* Tầng 2: cao hơn vị trí bình thường và không che tầng 1 */
      z-index: 11;
    }

    .timeline-node.overdue {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
      opacity: 0.65;
    }

    .timeline-node .node-time {
      display: block;
      font-size: 0.64rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    /* Delta Remaining Time Pill (NOW -> Boss 1, or Boss i -> Boss i+1) */
    .interval-pill {
      position: absolute;
      bottom: 2px;
      transform: translateX(-50%) scale(0.72);
      background-color: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.55);
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      z-index: 9;
      pointer-events: none;
    }

    body.light-mode .interval-pill {
      background-color: rgba(255, 255, 255, 0.92);
    }

    .timeline-footer-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 7px;
      font-size: 0.74rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .timeline-start-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .boss-density-row {
      flex-basis: 100%;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin-top: 7px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-color);
      font-size: 0.74rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .boss-density-row strong {
      color: var(--text-primary);
    }
    
    .btn-now-jump {
      padding: 2px 8px;
      font-size: 0.68rem;
      font-weight: 700;
      border-radius: 4px;
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-now-jump:hover {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    /* Card Grid (Minimalist Collapsible Cards) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 11px;
    }

    .boss-card {
      position: relative;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 11px 13px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .boss-card:hover {
      border-color: var(--accent-color);
      background-color: var(--surface-hover);
    }

    .boss-card.expanded {
      border-color: var(--accent-color);
      background-color: var(--surface-hover);
      box-shadow: 0 0 0 1px var(--accent-color), var(--shadow);
    }

    .boss-card.expired {
      background-color: var(--expired-bg);
      border-color: var(--expired-border);
      animation: pulseBorder 1.8s infinite;
    }

    @keyframes pulseBorder {
      0%, 100% { border-color: var(--expired-border); }
      50% { border-color: rgba(239, 68, 68, 0.35); }
    }

    .btn-card-close {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.65;
    }

    .btn-card-close:hover {
      background-color: rgba(239, 68, 68, 0.22);
      color: var(--danger-color);
      opacity: 1;
    }

    .card-summary {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 18px;
    }

    .card-name {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-times-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .card-target {
      font-size: 0.79rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .card-remaining {
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .boss-card.expired .card-remaining {
      color: var(--danger-color);
    }

    .boss-card.unset .card-remaining {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Expandable Edit Panel inside Card */
    .card-controls {
      display: none;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px dashed var(--border-color);
      cursor: default;
    }

    .boss-card.expanded .card-controls {
      display: block;
    }

    .hms-inputs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .hms-inputs input {
      width: 100%;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 4px;
      border-radius: 5px;
      font-size: 0.86rem;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
      user-select: text;
    }

    .hms-inputs input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
    }

    .card-action-btns {
      display: flex;
      gap: 6px;
    }

    .card-action-btns button {
      flex: 1;
      padding: 5px 6px;
      font-size: 0.78rem;
    }

    /* Toast-list (Bottom-Right, Auto-Height, Max 30 Items, No Scrollbar) */
    .toast-list-wrapper {
      position: fixed;
      bottom: 14px;
      right: 14px;
      width: 320px;
      max-width: calc(100vw - 28px);
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 9999;
      overflow: hidden;
      display: none;
    }

    .toast-list-wrapper.has-items {
      display: block;
    }

    .toast-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background-color: rgba(15, 23, 42, 0.35);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .btn-clear-toasts {
      padding: 2px 7px;
      font-size: 0.68rem;
      border-radius: 4px;
    }

    .toast-list {
      display: flex;
      flex-direction: column;
      height: auto;
      overflow: hidden;
    }

    .toast-item {
      padding: 6px 10px;
      font-size: 0.77rem;
      line-height: 1.35;
      color: var(--text-primary);
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      border-left: 3px solid var(--accent-color);
      word-break: break-word;
    }

    .toast-item:last-child {
      border-bottom: none;
    }

    .toast-item.success { border-left-color: var(--success-color); }
    .toast-item.warning { border-left-color: var(--warning-color); }
    .toast-item.error { border-left-color: var(--danger-color); }

    .toast-time {
      color: var(--text-secondary);
      font-size: 0.71rem;
      font-variant-numeric: tabular-nums;
      margin-right: 5px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-section">
      <span class="brand-title">Lander Timer</span>
      <span class="version-badge">v7.28</span>
      <span id="liveClock" class="clock-display">00:00:00</span>
    </div>

    <div class="toolbar-actions">
      <button type="button" id="btnAdminAuth">Admin Login</button>
      <button type="button" id="btnAddCard" class="primary">Add Card</button>
      <button type="button" id="btnPasteClipboard">Paste Image</button>
      <button type="button" id="btnWipeAll" class="danger">Wipe All</button>
      <button type="button" id="btnToggleConfig">Settings</button>
      <button type="button" id="btnThemeToggle">Light Mode</button>
    </div>
  </div>

  <!-- Collapsible Settings Panel -->
  <div id="configPanel" class="config-panel">
    <div class="config-grid">
      <div class="config-item">
        <label for="cfgGeminiKey">Gemini API Key (gemini-3.1-flash-lite)</label>
        <input type="password" id="cfgGeminiKey" placeholder="Locked - Admin login required" disabled readonly />
      </div>
      <div class="config-item">
        <label for="cfgFirebaseUrl">Firebase Realtime Database URL</label>
        <input type="text" id="cfgFirebaseUrl" placeholder="Locked - Admin login required" disabled readonly />
      </div>
      <div class="config-item">
        <label for="cfgCardsPath">Firebase Cards Path (default: cards)</label>
        <input type="text" id="cfgCardsPath" placeholder="Locked - Admin login required" disabled readonly />
      </div>
      <div class="config-item">
        <label for="cfgTgToken">Telegram Bot Token</label>
        <input type="password" id="cfgTgToken" placeholder="Locked - Admin login required" disabled readonly />
      </div>
      <div class="config-item">
        <label for="cfgTgChatId">Telegram Chat ID</label>
        <input type="text" id="cfgTgChatId" placeholder="Locked - Admin login required" disabled readonly />
      </div>
    </div>
    <div class="config-footer">
      <span id="settingsLockHint" class="paste-hint">All input boxes are locked &amp; encrypted. Click Admin Login to unlock.</span>
      <button type="button" id="btnSaveConfig" class="primary">Save Settings</button>
    </div>
  </div>

  <!-- Interactive Timeline -->
  <div class="timeline-wrapper">
    <div class="timeline-header">
      <span>Timeline (Drag to pan)</span>
      <div class="timeline-range-control">
        <label for="timelineRangeHours">Range (h):</label>
        <input type="number" id="timelineRangeHours" min="0.5" max="9" step="0.5" value="2" />
      </div>
    </div>

    <div id="timelineViewport" class="timeline-viewport">
      <div id="nowMarker" class="now-marker"></div>
      <div id="timelineNodesLayer"></div>
    </div>

    <div class="timeline-footer-row">
      <div class="timeline-start-group">
        <span id="timelineStartLabel">--:--</span>
        <button type="button" id="btnNowJump" class="btn-now-jump">NOW</button>
      </div>
      <span id="timelineEndLabel">--:--</span>
      <div id="bossDensityRow" class="boss-density-row">
        <span>Khoảng thời gian nhiều Boss nhất: <strong id="densityPeakRange">--:-- – --:--</strong></span>
        <span>Bosses: <strong id="densityPeakCount">0</strong></span>
        <span>Min Delta: <strong id="densityMinDelta">--</strong></span>
        <span>Max Delta: <strong id="densityMaxDelta">--</strong></span>
      </div>
    </div>
  </div>

  <!-- Cards Grid -->
  <div id="cardContainer" class="card-grid"></div>

  <!-- Toast-list (Bottom-Right, Auto-Height, Max 30 Items, No Scrollbar) -->
  <div id="toastListWrapper" class="toast-list-wrapper">
    <div class="toast-list-header">
      <span>Activity Log</span>
      <button type="button" id="btnClearToasts" class="btn-clear-toasts">Clear</button>
    </div>
    <div id="toastList" class="toast-list"></div>
  </div>

  <script>
    // =========================================================
    // ADMIN AUTH & SETTINGS ENCRYPTION (v7.22)
    // =========================================================
    const ADMIN_HASH = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"; 
    const CRYPTO_SALT = "LanderTimer_v722_KeySalt";
    // Encrypted default Settings bound to Admin_name
    const ENCRYPTED_DEFAULT_SETTINGS = {
      geminiKey: "",
      ffirebaseUrl: "KQYWBw4eE09qDhhqHhcGTR4ZCRhKDx01DRkCHB0WFF1KAAoYHw8bGR0QExsFGB4pAxw3HR4dGR8GFA1PFRwQ",
      cardsPath: "LQUAAh8bNg0fGhEf",
      tgToken: "",
      tgChatId: ""
    };

    let activeAdminName = "";
    let isAdminAuthenticated = false;

    async function sha256Hex(str) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest("SHA-256", buf);
      return Array.from(new Uint8Array(hashBuf))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function encryptWithAdmin(plainText, adminName) {
      if (!plainText) return "";
      const key = `${adminName}:${CRYPTO_SALT}`;
      const bytes = new TextEncoder().encode(plainText);
      const out = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) {
        out[i] = bytes[i] ^ key.charCodeAt(i % key.length);
      }
      let bin = "";
      for (let i = 0; i < out.length; i++) bin += String.fromCharCode(out[i]);
      return btoa(bin);
    }

    function decryptWithAdmin(cipherBase64, adminName) {
      if (!cipherBase64 || !adminName) return "";
      try {
        const key = `${adminName}:${CRYPTO_SALT}`;
        const bin = atob(cipherBase64);
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) {
          out[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
        }
        return new TextDecoder().decode(out);
      } catch (e) {
        return "";
      }
    }

    // =========================================================
    // STATE & STORAGE (v7.22)
    // =========================================================
    const STORAGE_KEY_CARDS = "lander_timer_cards_v72";
    const STORAGE_KEY_CFG_ENC = "lander_timer_cfg_v722_enc";
    const STORAGE_KEY_THEME = "lander_theme";
    const MAX_TOAST_ITEMS = 30;
    const TOAST_AUTO_HIDE_MS = 15000;

    let encryptedConfig = { ...ENCRYPTED_DEFAULT_SETTINGS };
    let config = {
      geminiKey: "",
      firebaseUrl: "",
      cardsPath: "cards",
      tgToken: "",
      tgChatId: ""
    };

    let cards = [];
    let expandedCardId = null;
    let lastRenderedOrderSignature = "";
    let toastAutoHideTimer = null;
    let db = null;
    let cardsRef = null;
    let isRemoteUpdate = false;

    // Timeline Pan & Range State (Default: 2 hours; Min: 30m = 0.5h; Max: 9h)
    const MIN_TIMELINE_RANGE_MS = 0.5 * 3600 * 1000;
    const MAX_TIMELINE_RANGE_MS = 9 * 3600 * 1000;
    const DEFAULT_TIMELINE_RANGE_MS = 2 * 3600 * 1000;
    let timelineWindowMs = DEFAULT_TIMELINE_RANGE_MS;
    let timelineOffsetMs = -2 * 60 * 1000; // Đưa đường đỏ NOW về gần sát mép trái
    let isDraggingTimeline = false;
    let dragStartX = 0;
    let dragStartOffsetMs = 0;

    // =========================================================
    // INITIALIZATION
    // =========================================================
    function init() {
      loadTheme();
      loadEncryptedConfig();
      const publicFirebaseUrl = "https://lander-timer-sync-default-rtdb.asia-southeast1.firebasedatabase.app";
      const publicCardsPath = "lander_cards";
      config.firebaseUrl = publicFirebaseUrl;
      config.cardsPath = publicCardsPath;
      loadLocalCards();
      applyInputLockState();
      bindEvents();
      render();
      initFirebase();
      setInterval(tickLoop, 200);
    }

    function loadTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
      if (savedTheme === "light") {
        document.body.classList.add("light-mode");
        document.getElementById("btnThemeToggle").textContent = "Dark Mode";
      }
    }

    function loadEncryptedConfig() {
      try {
        const rawEnc = localStorage.getItem(STORAGE_KEY_CFG_ENC);
        if (rawEnc) {
          encryptedConfig = { ...ENCRYPTED_DEFAULT_SETTINGS, ...JSON.parse(rawEnc) };
        }
      } catch (e) {
        encryptedConfig = { ...ENCRYPTED_DEFAULT_SETTINGS };
      }
    }

    function applyInputLockState() {
      const adminBtn = document.getElementById("btnAdminAuth");
      const lockHint = document.getElementById("settingsLockHint");
      const settingsIds = ["cfgGeminiKey", "cfgFirebaseUrl", "cfgCardsPath", "cfgTgToken", "cfgTgChatId"];

      if (isAdminAuthenticated) {
        adminBtn.textContent = `Welcome Admin (Logout)`;
        adminBtn.classList.add("admin-unlocked");
        if (lockHint) {
          lockHint.textContent = "Admin unlocked. Press Ctrl + V anywhere to parse Raidboss screenshot via Gemini AI.";
        }

        // Decrypt settings using Admin_name
        config.geminiKey = decryptWithAdmin(encryptedConfig.geminiKey, activeAdminName);
        config.firebaseUrl = decryptWithAdmin(encryptedConfig.firebaseUrl, activeAdminName);
        config.cardsPath = decryptWithAdmin(encryptedConfig.cardsPath, activeAdminName) || "cards";
        config.tgToken = decryptWithAdmin(encryptedConfig.tgToken, activeAdminName);
        config.tgChatId = decryptWithAdmin(encryptedConfig.tgChatId, activeAdminName);

        document.getElementById("cfgGeminiKey").value = config.geminiKey;
        document.getElementById("cfgFirebaseUrl").value = config.firebaseUrl;
        document.getElementById("cfgCardsPath").value = config.cardsPath;
        document.getElementById("cfgTgToken").value = config.tgToken;
        document.getElementById("cfgTgChatId").value = config.tgChatId;

        settingsIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.disabled = false;
            el.readOnly = false;
          }
        });
      } else {
        adminBtn.textContent = "Admin Login";
        adminBtn.classList.remove("admin-unlocked");
        if (lockHint) {
          lockHint.textContent = "All input boxes are locked & encrypted. Click Admin Login to unlock.";
        }

        const publicFirebaseUrl = "https://lander-timer-sync-default-rtdb.asia-southeast1.firebasedatabase.app";
        const publicCardsPath = "lander_cards";
        config = { geminiKey: "", firebaseUrl: publicFirebaseUrl, cardsPath: publicCardsPath, tgToken: "", tgChatId: "" };

        // Display encrypted values in locked state
        document.getElementById("cfgGeminiKey").value = encryptedConfig.geminiKey || "";
        document.getElementById("cfgFirebaseUrl").value = encryptedConfig.firebaseUrl || "";
        document.getElementById("cfgCardsPath").value = encryptedConfig.cardsPath || "";
        document.getElementById("cfgTgToken").value = encryptedConfig.tgToken || "";
        document.getElementById("cfgTgChatId").value = encryptedConfig.tgChatId || "";

        settingsIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.disabled = true;
            el.readOnly = true;
          }
        });
      }

      // Enforce lock state on all <input> elements across the document
      document.querySelectorAll("input").forEach(inp => {
        if (inp.id === "timelineRangeHours") {
          inp.disabled = false;
          inp.readOnly = false;
        } else {
          inp.disabled = !isAdminAuthenticated;
          inp.readOnly = !isAdminAuthenticated;
        }
      });
    }

    async function handleAdminAuthToggle() {
      if (isAdminAuthenticated) {
        isAdminAuthenticated = false;
        activeAdminName = "";
        collapseActiveCard();
        applyInputLockState();
        render();
        addToast("Admin logged out. All input boxes locked.", "info");
        return;
      }

      const entered = prompt("Enter Admin_name to unlock:");
      if (entered === null) return;

      const trimmed = entered.trim();
      const hashed = await sha256Hex(trimmed);
      if (hashed !== ADMIN_HASH) {
        addToast("Invalid Admin_name. Input boxes remain locked.", "error");
        return;
      }

      activeAdminName = trimmed;
      isAdminAuthenticated = true;

      // Migrate legacy plaintext config if present
      const legacyRaw = localStorage.getItem("lander_timer_cfg_v72") || localStorage.getItem("lander_timer_cfg_v717");
      if (legacyRaw && !localStorage.getItem(STORAGE_KEY_CFG_ENC)) {
        try {
          const leg = JSON.parse(legacyRaw);
          if (leg.geminiKey) encryptedConfig.geminiKey = encryptWithAdmin(leg.geminiKey, activeAdminName);
          if (leg.firebaseUrl) encryptedConfig.firebaseUrl = encryptWithAdmin(leg.firebaseUrl, activeAdminName);
          if (leg.cardsPath) encryptedConfig.cardsPath = encryptWithAdmin(leg.cardsPath, activeAdminName);
          if (leg.tgToken) encryptedConfig.tgToken = encryptWithAdmin(leg.tgToken, activeAdminName);
          if (leg.tgChatId) encryptedConfig.tgChatId = encryptWithAdmin(leg.tgChatId, activeAdminName);
          localStorage.setItem(STORAGE_KEY_CFG_ENC, JSON.stringify(encryptedConfig));
        } catch (e) {}
      }

      applyInputLockState();
      render();
      initFirebase();
      addToast(`Admin "${activeAdminName}" authenticated. Input boxes unlocked.`, "success");
    }

    function loadLocalCards() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CARDS) || localStorage.getItem("lander_timer_cards_v717");
        if (raw) {
          cards = normalizeCards(JSON.parse(raw));
          localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(cards));
        }
      } catch (e) {
        cards = [];
      }
    }

    function normalizeCards(list) {
      if (!Array.isArray(list)) return [];
      list.forEach((c, idx) => {
        if (!c.id) c.id = "boss_" + idx + "_" + String(c.name || idx).replace(/\s+/g, "_");
        if (typeof c.originalIndex !== "number") c.originalIndex = idx;
        if (typeof c.target === "string") c.target = Number(c.target) || null;
        if (c.target === undefined) c.target = null;
      });
      return list;
    }

    // =========================================================
    // FIREBASE SYNC & UNIFIED NOTIFICATION TRANSACTION
    // =========================================================
    function initFirebase() {
      if (!config.firebaseUrl) return;
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp({ databaseURL: config.firebaseUrl });
        }
        db = firebase.database();

        // Auto-load Telegram & Gemini keys from Firebase 'telegram_config' if available
        db.ref("telegram_config").on("value", (snap) => {
          if (!isAdminAuthenticated) return;
          const tgVal = snap.val();
          if (!tgVal) return;
          let updated = false;
          if (!config.tgToken && (tgVal.botToken || tgVal.tgToken)) {
            config.tgToken = tgVal.botToken || tgVal.tgToken;
            encryptedConfig.tgToken = encryptWithAdmin(config.tgToken, activeAdminName);
            document.getElementById("cfgTgToken").value = config.tgToken;
            updated = true;
          }
          if (!config.tgChatId && (tgVal.chatId || tgVal.tgChatId)) {
            config.tgChatId = tgVal.chatId || tgVal.tgChatId;
            encryptedConfig.tgChatId = encryptWithAdmin(config.tgChatId, activeAdminName);
            document.getElementById("cfgTgChatId").value = config.tgChatId;
            updated = true;
          }
          if (!config.geminiKey && (tgVal.geminiKey || tgVal.apiKey)) {
            config.geminiKey = tgVal.geminiKey || tgVal.apiKey;
            encryptedConfig.geminiKey = encryptWithAdmin(config.geminiKey, activeAdminName);
            document.getElementById("cfgGeminiKey").value = config.geminiKey;
            updated = true;
          }
          if (updated) {
            localStorage.setItem(STORAGE_KEY_CFG_ENC, JSON.stringify(encryptedConfig));
          }
        });

        attachCardsListener(config.cardsPath || "lander_cards");

        // Auto-check fallback path 'cards' if 'lander_cards' does not exist
        db.ref(config.cardsPath || "lander_cards").once("value", (snap) => {
          if (!snap.exists()) {
            db.ref("cards").once("value", (fallbackSnap) => {
              if (fallbackSnap.exists() && config.cardsPath === "lander_cards") {
                config.cardsPath = "cards";
                encryptedConfig.cardsPath = encryptWithAdmin("cards", activeAdminName);
                document.getElementById("cfgCardsPath").value = "cards";
                localStorage.setItem(STORAGE_KEY_CFG_ENC, JSON.stringify(encryptedConfig));
                attachCardsListener("cards");
              }
            });
          }
        });
      } catch (err) {
        console.error(err);
        addToast("Firebase connection error: " + err.message, "error");
      }
    }

    function attachCardsListener(path) {
      if (cardsRef) cardsRef.off();
      cardsRef = db.ref(path);

      cardsRef.on("value", (snapshot) => {
        const val = snapshot.val();
        if (!val) return;
        isRemoteUpdate = true;
        const arr = Array.isArray(val)
          ? val.filter(Boolean)
          : Object.keys(val).map(k => ({ id: k, ...val[k] }));
        cards = normalizeCards(arr);
        localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(cards));

        if (!expandedCardId) {
          render();
        } else {
          updateLiveCountdowns(Date.now());
          renderTimeline(Date.now());
        }
        isRemoteUpdate = false;
      }, (err) => {
        addToast("Firebase Read Error: " + err.message, "error");
      });
    }

    function saveAndSync() {
      localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(cards));
      if (cardsRef && !isRemoteUpdate) {
        cardsRef.set(cards).catch(err => addToast("Sync error: " + err.message, "error"));
      }
    }

    function triggerUnifiedNotification(card, remainingSecs) {
      const secsLabel = Math.max(1, Math.ceil(remainingSecs));
      const message = `${card.name}: Sắp đến giờ! (Còn ${secsLabel} giây)`;
      
      // Nếu chưa đăng nhập admin, phát web notification trực tiếp và lưu trạng thái cảnh báo cục bộ
      if (!isAdminAuthenticated) {
        card.warned60s = true;
        card.warnedDone = true;
        localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(cards));
        showBrowserNotification(message);
        return;
      }

      if (cardsRef) {
        const cardIndex = cards.findIndex(c => c.id === card.id);
        if (cardIndex === -1) return;
        const cardNodeRef = cardsRef.child(`${cardIndex}`);

        cardNodeRef.transaction((currentData) => {
          if (!currentData) return currentData;
          if (currentData.warned60s) return;
          currentData.warned60s = true;
          currentData.warnedDone = true;
          return currentData;
        }, (error, committed) => {
          if (!error && committed) {
            sendTelegramMessage(message);
            showBrowserNotification(message);
          }
        });
      } else {
        card.warned60s = true;
        card.warnedDone = true;
        saveAndSync();
        sendTelegramMessage(message);
        showBrowserNotification(message);
      }
    }

    async function sendTelegramMessage(text) {
      if (!config.tgToken || !config.tgChatId) return;
      try {
        const url = `https://api.telegram.org/bot${config.tgToken}/sendMessage`;
        await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: config.tgChatId,
            text: text
          })
        });
      } catch (e) {
        console.error("Telegram Error:", e);
      }
    }

    function showBrowserNotification(text) {
      addToast(text, "warning");
      if ("Notification" in window) {
        if (Notification.permission === "granted") {
          try {
            new Notification("Lander Timer", { body: text });
          } catch (e) {
            console.error("Notification Error:", e);
          }
        } else if (Notification.permission !== "denied") {
          Notification.requestPermission().then(perm => {
           if (perm === "granted") {
              try {
                new Notification("Lander Timer", { body: text });
              } catch (e) {
                console.error("Notification Error:", e);
              }
            }
          });
        }
      }
    }
    
    function ensureNotificationPermissionOnGesture() {
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().catch(() => {});
      }
    }

    // =========================================================
    // REAL-TIME SORTING & TIMER LOOP
    // =========================================================
    function getSortedCards(now) {
      return [...cards].sort((a, b) => {
        const aHasTarget = a.target !== null;
        const bHasTarget = b.target !== null;

        if (aHasTarget && !bHasTarget) return -1;
        if (!aHasTarget && bHasTarget) return 1;

        if (aHasTarget && bHasTarget) {
          const aRem = Math.max(0, a.target - now);
          const bRem = Math.max(0, b.target - now);
          if (aRem !== bRem) return aRem - bRem;
          if (a.target !== b.target) return a.target - b.target;
        }

        return (a.originalIndex ?? 0) - (b.originalIndex ?? 0);
      });
    }

    function tickLoop() {
      const now = Date.now();
      document.getElementById("liveClock").textContent = formatClockTime(now);

      cards.forEach(card => {
        if (!card.target) return;
        const diffSecs = (card.target - now) / 1000;
        if (diffSecs <= 60 && diffSecs > -15 && !card.warned60s) {
          card.warned60s = true;
          card.warnedDone = true;
          triggerUnifiedNotification(card, diffSecs);
        }
      });

      const sorted = getSortedCards(now);
      const currentSignature = sorted
        .map(c => `${c.id}:${c.target !== null && c.target <= now ? 1 : 0}`)
        .join("|");

      if (currentSignature !== lastRenderedOrderSignature && !expandedCardId) {
        render();
        return;
      }

      updateLiveCountdowns(now);
      renderTimeline(now);
    }

    function updateLiveCountdowns(now) {
      cards.forEach(card => {
        const remEl = document.getElementById(`rem_${card.id}`);
        const targetEl = document.getElementById(`tgt_${card.id}`);
        const cardEl = document.getElementById(`card_${card.id}`);
        if (!remEl || !cardEl) return;

        if (!card.target) {
          if (targetEl) targetEl.textContent = "Target: --:--:--";
          remEl.textContent = "--:--:--";
          cardEl.classList.remove("expired");
          cardEl.classList.add("unset");
          return;
        }

        cardEl.classList.remove("unset");
        if (targetEl) targetEl.textContent = `Target: ${formatClockTime(card.target)}`;

        const diff = card.target - now;
        if (diff <= 0) {
          remEl.textContent = "00:00:00";
          cardEl.classList.add("expired");
        } else {
          remEl.textContent = formatDuration(diff);
          cardEl.classList.remove("expired");
        }
      });
    }

    // =========================================================
    // CARD RENDERING & SINGLE-EXPANDED FOCUS MANAGEMENT
    // =========================================================
    function expandCardAndFocusHour(id) {
      expandedCardId = id;
      render();

      if (!isAdminAuthenticated) {
        addToast("Input boxes are locked. Login as Admin to edit.", "warning");
        return;
      }

      const hInput = document.getElementById(`in_h_${id}`);
      if (hInput) {
        hInput.focus();
        hInput.select();
      }
    }

    function collapseActiveCard() {
      if (!expandedCardId) return;
      expandedCardId = null;
      if (document.activeElement && typeof document.activeElement.blur === "function") {
        document.activeElement.blur();
      }
      render();
    }

    function render() {
      const now = Date.now();
      const sorted = getSortedCards(now);
      lastRenderedOrderSignature = sorted
        .map(c => `${c.id}:${c.target !== null && c.target <= now ? 1 : 0}`)
        .join("|");

      const container = document.getElementById("cardContainer");
      container.innerHTML = "";

      if (sorted.length === 0) {
        container.innerHTML = `<div style="color:var(--text-secondary); font-size:0.84rem; padding:10px;">Waiting for Admin login / Firebase data or click Add Card...</div>`;
        renderTimeline(now);
        return;
      }

      const lockAttrs = isAdminAuthenticated ? "" : "disabled readonly";

      sorted.forEach(card => {
        const isExpired = card.target !== null && card.target <= now;
        const isUnset = card.target === null;
        const isExpanded = expandedCardId === card.id;

        const cardEl = document.createElement("div");
        cardEl.id = `card_${card.id}`;
        cardEl.className = `boss-card ${isExpired ? "expired" : ""} ${isUnset ? "unset" : ""} ${isExpanded ? "expanded" : ""}`;

        const targetStr = card.target ? formatClockTime(card.target) : "--:--:--";
        const remStr = isUnset ? "--:--:--" : (isExpired ? "00:00:00" : formatDuration(card.target - now));

        cardEl.innerHTML = `
          <button type="button" class="btn-card-close" title="Remove card" data-action="delete" data-id="${card.id}">x</button>
          <div class="card-summary">
            <div class="card-name">${escapeHtml(card.name)}</div>
            <div class="card-times-row">
              <span id="tgt_${card.id}" class="card-target">Target: ${targetStr}</span>
              <span id="rem_${card.id}" class="card-remaining">${remStr}</span>
            </div>
          </div>
          <div class="card-controls">
            <div class="hms-inputs">
              <input type="number" inputmode="numeric" min="0" max="99" placeholder="H" id="in_h_${card.id}" ${lockAttrs} />
              <input type="number" inputmode="numeric" min="0" max="59" placeholder="M" id="in_m_${card.id}" ${lockAttrs} />
              <input type="number" inputmode="numeric" min="0" max="59" placeholder="S" id="in_s_${card.id}" ${lockAttrs} />
            </div>
            <div class="card-action-btns">
              <button type="button" class="primary" data-action="set" data-id="${card.id}">Set</button>
              <button type="button" data-action="wipe" data-id="${card.id}">Wipe</button>
              <button type="button" data-action="rename" data-id="${card.id}">Rename</button>
            </div>
          </div>
        `;

        cardEl.addEventListener("click", (e) => {
          e.stopPropagation();

          if (e.target.tagName === "INPUT") {
            return;
          }

          const actionBtn = e.target.closest("[data-action]");
          if (actionBtn) {
            const action = actionBtn.getAttribute("data-action");
            const id = actionBtn.getAttribute("data-id");

            if (action === "delete") deleteCard(id);
            else if (action === "set") setCardTimerFromInputs(id);
            else if (action === "wipe") wipeCardTimer(id);
            else if (action === "rename") renameCard(id);
            return;
          }

          if (expandedCardId !== card.id) {
            expandCardAndFocusHour(card.id);
          }
        });

        cardEl.querySelectorAll("input").forEach(inp => {
          inp.addEventListener("keydown", (e) => {
            if (!isAdminAuthenticated) return;
            if (e.key === "Enter") {
              e.preventDefault();
              setCardTimerFromInputs(card.id);
            } else if (e.key === "Escape") {
              e.preventDefault();
              collapseActiveCard();
            }
          });
        });

        container.appendChild(cardEl);
      });

      renderTimeline(now);
    }

    // =========================================================
    // CARD ACTIONS
    // =========================================================
    function setCardTimerFromInputs(id) {
      if (!isAdminAuthenticated) {
        addToast("Admin login required to edit timers", "warning");
        return;
      }
      const h = parseInt(document.getElementById(`in_h_${id}`)?.value || "0", 10) || 0;
      const m = parseInt(document.getElementById(`in_m_${id}`)?.value || "0", 10) || 0;
      const s = parseInt(document.getElementById(`in_s_${id}`)?.value || "0", 10) || 0;

      const totalMs = ((h * 3600) + (m * 60) + s) * 1000;
      if (totalMs <= 0) {
        addToast("Enter a valid duration greater than 0", "warning");
        const hInput = document.getElementById(`in_h_${id}`);
        if (hInput) hInput.focus();
        return;
      }

      const card = cards.find(c => c.id === id);
      if (!card) return;

      card.target = Date.now() + totalMs;
      card.warned60s = false;
      card.warnedDone = false;
      expandedCardId = null;
      if (document.activeElement) document.activeElement.blur();

      saveAndSync();
      render();
      addToast(`${card.name} set to ${formatClockTime(card.target)}`, "success");
    }

    function wipeCardTimer(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      card.target = null;
      card.warned60s = false;
      card.warnedDone = false;
      expandedCardId = null;
      if (document.activeElement) document.activeElement.blur();

      saveAndSync();
      render();
      addToast(`Wiped ${card.name}`, "info");
    }

    function renameCard(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      const newName = prompt("Enter new Boss name:", card.name);
      if (newName && newName.trim()) {
        const oldName = card.name;
        card.name = newName.trim();
        saveAndSync();
        render();
        addToast(`Renamed "${oldName}" to "${card.name}"`, "info");
      }
    }

    function deleteCard(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      if (!confirm(`Delete "${card.name}"?`)) return;
      cards = cards.filter(c => c.id !== id);
      cards.forEach((c, idx) => c.originalIndex = idx);
      if (expandedCardId === id) expandedCardId = null;
      saveAndSync();
      render();
      addToast(`Deleted ${card.name}`, "warning");
    }

    // =========================================================
    // TIMELINE RENDERING (2-TIER NODES, VERTICAL DOT LINES, DELTA TIME)
    // =========================================================
    function formatDeltaLabel(gapMs) {
      const gapMins = Math.max(0, Math.round(gapMs / 60000));
      const h = Math.floor(gapMins / 60);
      const m = gapMins % 60;
      return h > 0 ? `${h}h${m > 0 ? m + "m" : ""}` : `${m}m`;
    }
    function formatDensityDelta(ms) {
      const totalSecs = Math.max(0, Math.round(ms / 1000));
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return s > 0 ? `${m}m ${s}s` : `${m}m`;
      return `${s}s`;
    }

    function updateBossDensitySummary(now) {
      const WINDOW_90M_MS = 90 * 60 * 1000;
      // Lấy toàn bộ các card đang có Remaining time (> 0), độc lập với timeline pan/range
      const activeTargets = cards
        .filter(c => c.target !== null && c.target > now)
        .map(c => c.target)
        .sort((a, b) => a - b);

      const rangeEl = document.getElementById("densityPeakRange");
      const countEl = document.getElementById("densityPeakCount");
      const minEl = document.getElementById("densityMinDelta");
      const maxEl = document.getElementById("densityMaxDelta");
      if (!rangeEl || !countEl || !minEl || !maxEl) return;

      if (activeTargets.length === 0) {
        rangeEl.textContent = "--:-- – --:--";
        countEl.textContent = "0";
        minEl.textContent = "--";
        maxEl.textContent = "--";
        return;
      }

      let bestCluster = [];
      for (let i = 0; i < activeTargets.length; i++) {
        const startTs = activeTargets[i];
        const endTs = startTs + WINDOW_90M_MS;
        const cluster = activeTargets.filter(t => t >= startTs && t <= endTs);

        const bestSpan = bestCluster.length > 0 ? (bestCluster[bestCluster.length - 1] - bestCluster[0]) : Infinity;
        const curSpan = cluster[cluster.length - 1] - cluster[0];

        if (cluster.length > bestCluster.length || (cluster.length === bestCluster.length && curSpan < bestSpan)) {
          bestCluster = cluster;
        }
      }

      const firstTs = bestCluster[0];
      const lastTs = bestCluster[bestCluster.length - 1];
      rangeEl.textContent = bestCluster.length === 1
        ? formatShortTime(firstTs)
        : `${formatShortTime(firstTs)} – ${formatShortTime(lastTs)}`;
      countEl.textContent = String(bestCluster.length);

      if (bestCluster.length < 2) {
        minEl.textContent = "--";
        maxEl.textContent = "--";
        return;
      }

      const deltas = [];
      for (let i = 0; i < bestCluster.length - 1; i++) {
        deltas.push(bestCluster[i + 1] - bestCluster[i]);
      }
      minEl.textContent = formatDensityDelta(Math.min(...deltas));
      maxEl.textContent = formatDensityDelta(Math.max(...deltas));
    }


    function renderDeltaPill(container, startTs, endTs, viewStart, viewportWidth) {
      if (endTs <= startTs) return;
      const midTime = (startTs + endTs) / 2;
      const midPct = ((midTime - viewStart) / timelineWindowMs) * 100;
      const gapPx = ((endTs - startTs) / timelineWindowMs) * viewportWidth;

      if (midPct >= 0 && midPct <= 100 && gapPx >= 36) {
        const pill = document.createElement("div");
        pill.className = "interval-pill";
        pill.style.left = `${midPct}%`;
        pill.textContent = formatDeltaLabel(endTs - startTs);
        container.appendChild(pill);
      }
    }

    function renderTimeline(now) {
      const viewport = document.getElementById("timelineViewport");
      const nodesLayer = document.getElementById("timelineNodesLayer");
      const nowMarker = document.getElementById("nowMarker");

      const viewStart = now + timelineOffsetMs;
      const viewEnd = viewStart + timelineWindowMs;

      document.getElementById("timelineStartLabel").textContent = formatShortTime(viewStart);
      document.getElementById("timelineEndLabel").textContent = formatShortTime(viewEnd);
      
      updateBossDensitySummary(now);
      
      const nowPct = ((now - viewStart) / timelineWindowMs) * 100;
      if (nowPct >= 0 && nowPct <= 100) {
        nowMarker.style.display = "block";
        nowMarker.style.left = `${nowPct}%`;
      } else {
        nowMarker.style.display = "none";
      }

      const sixtyFiveMinsMs = 65 * 60 * 1000;
      const activeNodes = cards
        .filter(c => c.target !== null && (now - c.target) <= sixtyFiveMinsMs)
        .sort((a, b) => a.target - b.target);

      nodesLayer.innerHTML = "";
      const viewportWidth = viewport.clientWidth || 800;

      // Delta remaining time từ NOW đến Boss đầu tiên (chưa quá giờ)
      const firstUpcoming = activeNodes.find(c => c.target > now);
      if (firstUpcoming) {
        renderDeltaPill(nodesLayer, now, firstUpcoming.target, viewStart, viewportWidth);
      }

      let lastTier1Px = -Infinity;
      let lastTier2Px = -Infinity;
      const MIN_HORIZONTAL_GAP_PX = 92;

      activeNodes.forEach((card, idx) => {
        const pct = ((card.target - viewStart) / timelineWindowMs) * 100;
        const xPx = (pct / 100) * viewportWidth;

        if (pct >= -15 && pct <= 115) {
          let tier = 1;
          if (xPx - lastTier1Px < MIN_HORIZONTAL_GAP_PX) {
            if (xPx - lastTier2Px >= MIN_HORIZONTAL_GAP_PX) {
              tier = 2;
            } else {
              tier = (xPx - lastTier2Px) > (xPx - lastTier1Px) ? 2 : 1;
            }
          }

          if (tier === 2) {
            lastTier2Px = xPx;
          } else {
            lastTier1Px = xPx;
          }

          const isOverdue = card.target <= now;

          // Vertical dot line chỉ đúng thời điểm target time của boss
          const dotLine = document.createElement("div");
          dotLine.className = `vertical-dot-line ${tier === 2 ? "tier-2-line" : "tier-1-line"} ${isOverdue ? "overdue-line" : ""}`;
          dotLine.style.left = `${pct}%`;
          nodesLayer.appendChild(dotLine);

          // Boss node (left edge aligned at pct)
          const node = document.createElement("div");
          node.className = `timeline-node ${tier === 2 ? "tier-2" : ""} ${isOverdue ? "overdue" : ""}`;
          node.style.left = `${pct}%`;
          node.innerHTML = `${escapeHtml(card.name)}<span class="node-time">${formatShortTime(card.target)}</span>`;
          nodesLayer.appendChild(node);
        }

        // Delta remaining time giữa hai Boss liên tiếp (bỏ qua nếu Boss hiện tại đã đến giờ / quá giờ)
        if (card.target > now && idx < activeNodes.length - 1) {
          const nextCard = activeNodes[idx + 1];
          renderDeltaPill(nodesLayer, card.target, nextCard.target, viewStart, viewportWidth);
        }
      });
    }

    // =========================================================
    // AI CLIPBOARD OCR (GEMINI DATA - API LATENCY - 15s)
    // =========================================================
    const AI_PROMPT = `Extract all Raidboss names and their remaining respawn countdown timers from this screenshot.
Return ONLY a valid JSON array with objects having keys: "name" (string), "hours" (number), "minutes" (number), "seconds" (number).
If a boss has no timer or is already alive/spawned, omit it or set hours/minutes/seconds to 0.
Example: [{"name": "Fafurion", "hours": 1, "minutes": 42, "seconds": 15}]`;

    async function handleImageBlob(blob) {
      if (!isAdminAuthenticated) {
        addToast("Admin login required before pasting image", "warning");
        return;
      }
      if (!config.geminiKey) {
        addToast("Configure Gemini API Key in Settings first", "warning");
        document.getElementById("configPanel").classList.add("open");
        return;
      }

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Data = reader.result.split(",")[1];
        await parseAiDataAndSync(base64Data, blob.type || "image/png");
      };
      reader.readAsDataURL(blob);
    }

    async function parseAiDataAndSync(base64Image, mimeType) {
      const apiStartTime = Date.now();
      addToast("Analyzing clipboard image via Gemini...", "info");

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${encodeURIComponent(config.geminiKey)}`;
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: AI_PROMPT },
                { inline_data: { mime_type: mimeType, data: base64Image } }
              ]
            }]
          })
        });

        if (!response.ok) {
          const errBody = await response.text();
          throw new Error(`HTTP ${response.status}: ${errBody.slice(0, 70)}`);
        }

        const data = await response.json();
        const apiEndTime = Date.now();

        // Remaining time = Gemini API data - API latency - 15s
        const apiLatencyMs = apiEndTime - apiStartTime;
        const fixedCaptureOffsetMs = 15 * 1000;
        const totalSubtractedSecs = ((apiLatencyMs + fixedCaptureOffsetMs) / 1000).toFixed(1);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
        const jsonMatch = rawText.match(/\[[\s\S]*\]/);
        const cleanedJson = jsonMatch ? jsonMatch[0] : "[]";
        const parsedList = JSON.parse(cleanedJson);

        let updatedCount = 0;

        parsedList.forEach(item => {
          if (!item || !item.name) return;
          const h = Number(item.hours) || 0;
          const m = Number(item.minutes) || 0;
          const s = Number(item.seconds) || 0;

          if (h === 0 && m === 0 && s === 0) return;

          const matchedCard = cards.find(c =>
            c.name.trim().toLowerCase() === item.name.trim().toLowerCase()
          );

          if (matchedCard) {
            const rawRemainingMs = ((h * 3600) + (m * 60) + s) * 1000;
            const adjustedRemainingMs = Math.max(0, rawRemainingMs - apiLatencyMs - fixedCaptureOffsetMs);

            matchedCard.target = apiEndTime + adjustedRemainingMs;
            matchedCard.warned60s = false;
            matchedCard.warnedDone = false;
            updatedCount++;
          }
        });

        if (updatedCount > 0) {
          expandedCardId = null;
          saveAndSync();
          render();
          addToast(`OCR updated ${updatedCount} Boss(es) (-${totalSubtractedSecs}s)`, "success");
        } else {
          addToast("No matching Boss timers found in image", "warning");
        }
      } catch (err) {
        console.error("AI Parse Error:", err);
        addToast(`AI Error: ${err.message}`, "error");
      }
    }

    // =========================================================
    // UI EVENTS & TOAST-LIST HELPERS
    // =========================================================
    function bindEvents() {
      // Xin quyền Web Notification khi người dùng có thao tác đầu tiên trên trang
      document.addEventListener("pointerdown", ensureNotificationPermissionOnGesture, { once: true });

      // Admin Login / Logout
      document.getElementById("btnAdminAuth").addEventListener("click", handleAdminAuthToggle);

      // Collapse active card & remove focus when clicking/tapping outside the active card
      document.addEventListener("click", (e) => {
        if (!expandedCardId) return;
        if (e.target.closest("#toastListWrapper")) return;

        const clickedCard = e.target.closest(".boss-card");
        if (!clickedCard || clickedCard.id !== `card_${expandedCardId}`) {
          collapseActiveCard();
        }
      });

      // Global Ctrl+V Paste listener
      window.addEventListener("paste", (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("image") !== -1) {
            const blob = items[i].getAsFile();
            if (blob) handleImageBlob(blob);
            break;
          }
        }
      });

      // Manual Paste Button
      document.getElementById("btnPasteClipboard").addEventListener("click", async () => {
        try {
          const clipboardItems = await navigator.clipboard.read();
          for (const item of clipboardItems) {
            const imageType = item.types.find(t => t.startsWith("image/"));
            if (imageType) {
              const blob = await item.getType(imageType);
              await handleImageBlob(blob);
              return;
            }
          }
          addToast("No image found in clipboard", "warning");
        } catch (err) {
          addToast("Press Ctrl + V anywhere on the page to paste image", "info");
        }
      });

      // Add Card
      document.getElementById("btnAddCard").addEventListener("click", () => {
        const name = prompt("Enter Boss name:");
        if (!name || !name.trim()) return;
        cards.push({
          id: "boss_" + Date.now(),
          name: name.trim(),
          target: null,
          originalIndex: cards.length,
          warned60s: false,
          warnedDone: false
        });
        saveAndSync();
        render();
        addToast(`Added ${name.trim()}`, "success");
      });

      // Wipe All
      document.getElementById("btnWipeAll").addEventListener("click", () => {
        if (!confirm("Wipe all active timers?")) return;
        cards.forEach(c => {
          c.target = null;
          c.warned60s = false;
          c.warnedDone = false;
        });
        collapseActiveCard();
        saveAndSync();
        render();
        addToast("All timers wiped", "info");
      });

      // Toggle Settings
      document.getElementById("btnToggleConfig").addEventListener("click", () => {
        document.getElementById("configPanel").classList.toggle("open");
      });

      // Save Settings (Encrypted with Admin_name)
      document.getElementById("btnSaveConfig").addEventListener("click", () => {
        if (!isAdminAuthenticated) {
          addToast("Admin login required to save Settings", "warning");
          return;
        }
        config.geminiKey = document.getElementById("cfgGeminiKey").value.trim();
        config.firebaseUrl = document.getElementById("cfgFirebaseUrl").value.trim().replace(/\/+$/, "");
        config.cardsPath = document.getElementById("cfgCardsPath").value.trim() || "lander_cards";
        config.tgToken = document.getElementById("cfgTgToken").value.trim();
        config.tgChatId = document.getElementById("cfgTgChatId").value.trim();

        encryptedConfig = {
          geminiKey: encryptWithAdmin(config.geminiKey, activeAdminName),
          firebaseUrl: encryptWithAdmin(config.firebaseUrl, activeAdminName),
          cardsPath: encryptWithAdmin(config.cardsPath, activeAdminName),
          tgToken: encryptWithAdmin(config.tgToken, activeAdminName),
          tgChatId: encryptWithAdmin(config.tgChatId, activeAdminName)
        };

        localStorage.setItem(STORAGE_KEY_CFG_ENC, JSON.stringify(encryptedConfig));
        document.getElementById("configPanel").classList.remove("open");
        addToast("Encrypted settings saved", "success");
        initFirebase();
      });

      // Theme Toggle
      document.getElementById("btnThemeToggle").addEventListener("click", () => {
        const isLight = document.body.classList.toggle("light-mode");
        localStorage.setItem(STORAGE_KEY_THEME, isLight ? "light" : "dark");
        document.getElementById("btnThemeToggle").textContent = isLight ? "Dark Mode" : "Light Mode";
      });

      // Clear Toast-list
      document.getElementById("btnClearToasts").addEventListener("click", (e) => {
        e.stopPropagation();
        if (toastAutoHideTimer) {
          clearTimeout(toastAutoHideTimer);
          toastAutoHideTimer = null;
        }
        const listEl = document.getElementById("toastList");
        const wrapper = document.getElementById("toastListWrapper");
        listEl.innerHTML = "";
        wrapper.classList.remove("has-items");
      });

      // NOW Jump Button
      document.getElementById("btnNowJump").addEventListener("click", () => {
        timelineOffsetMs = -2 * 60 * 1000;
        renderTimeline(Date.now());
      });

      // Timeline Range Input (0.5h = 30m min, 9h max)
      const rangeInput = document.getElementById("timelineRangeHours");
      function applyTimelineRangeFromInput() {
        const rawVal = parseFloat(rangeInput.value);
        if (Number.isNaN(rawVal)) {
          rangeInput.value = String(timelineWindowMs / 3600000);
          return;
        }
        const clampedMs = Math.min(MAX_TIMELINE_RANGE_MS, Math.max(MIN_TIMELINE_RANGE_MS, rawVal * 3600000));
        timelineWindowMs = clampedMs;
        rangeInput.value = String(clampedMs / 3600000);
        renderTimeline(Date.now());
      }
      rangeInput.addEventListener("change", applyTimelineRangeFromInput);
      rangeInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") applyTimelineRangeFromInput();
      });

      // Timeline Drag-to-Pan
      const viewport = document.getElementById("timelineViewport");
      viewport.addEventListener("mousedown", (e) => {
        isDraggingTimeline = true;
        dragStartX = e.clientX;
        dragStartOffsetMs = timelineOffsetMs;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDraggingTimeline) return;
        const dx = e.clientX - dragStartX;
        const width = viewport.clientWidth || 800;
        const deltaMs = -(dx / width) * timelineWindowMs;
        timelineOffsetMs = dragStartOffsetMs + deltaMs;
        renderTimeline(Date.now());
      });

      window.addEventListener("mouseup", () => {
        isDraggingTimeline = false;
      });

      // Touch support for Timeline Drag
      viewport.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          isDraggingTimeline = true;
          dragStartX = e.touches[0].clientX;
          dragStartOffsetMs = timelineOffsetMs;
        }
      }, { passive: true });

      viewport.addEventListener("touchmove", (e) => {
        if (!isDraggingTimeline || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - dragStartX;
        const width = viewport.clientWidth || 800;
        const deltaMs = -(dx / width) * timelineWindowMs;
        timelineOffsetMs = dragStartOffsetMs + deltaMs;
        renderTimeline(Date.now());
      }, { passive: true });

      viewport.addEventListener("touchend", () => {
        isDraggingTimeline = false;
      });
    }

    // Toast-list: Bottom-Right, Auto-Height, Max 30 Items, Auto-hide 15s after last change
    function addToast(message, type = "info") {
      const wrapper = document.getElementById("toastListWrapper");
      const listEl = document.getElementById("toastList");
      if (!wrapper || !listEl) return;

      const item = document.createElement("div");
      item.className = `toast-item ${type}`;
      item.innerHTML = `<span class="toast-time">[${formatClockTime(Date.now())}]</span>${escapeHtml(message)}`;

      listEl.prepend(item);
      wrapper.classList.add("has-items");

      while (listEl.children.length > MAX_TOAST_ITEMS) {
        listEl.removeChild(listEl.lastChild);
      }

      if (toastAutoHideTimer) {
        clearTimeout(toastAutoHideTimer);
      }
      toastAutoHideTimer = setTimeout(() => {
        wrapper.classList.remove("has-items");
        toastAutoHideTimer = null;
      }, TOAST_AUTO_HIDE_MS);
    }

    function formatClockTime(ts) {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }

    function formatShortTime(ts) {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    function formatDuration(ms) {
      const totalSecs = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Start Application
    init();
  </script>
