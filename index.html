<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lander Timer Web v7.17</title>
  <!-- Firebase SDK v9 Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --surface-color: #1e293b;
      --surface-hover: #273549;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --success-color: #22c55e;
      --warning-color: #f59e0b;
      --expired-bg: rgba(239, 68, 68, 0.14);
      --expired-border: #ef4444;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --surface-color: #ffffff;
      --surface-hover: #f8fafc;
      --border-color: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #dc2626;
      --danger-hover: #b91c1c;
      --success-color: #16a34a;
      --warning-color: #d97706;
      --expired-bg: rgba(220, 38, 38, 0.08);
      --expired-border: #dc2626;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 16px 20px 60px;
      transition: background-color 0.2s, color 0.2s;
      user-select: none;
    }

    /* Header & Toolbar */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-section {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .version-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-color);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .clock-display {
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button {
      background-color: var(--surface-color);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent-color);
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    button.primary:hover {
      background-color: var(--accent-hover);
    }

    button.danger {
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.4);
    }

    button.danger:hover {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    /* Config Drawer */
    .config-panel {
      display: none;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .config-panel.open {
      display: block;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .config-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-item label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .config-item input {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      user-select: text;
    }

    .config-footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .paste-hint {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* Timeline Section */
    .timeline-wrapper {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .peak-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
    }

    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 3px;
    }

    .timeline-viewport {
      position: relative;
      width: 100%;
      height: 88px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      cursor: grab;
    }

    .timeline-viewport:active {
      cursor: grabbing;
    }

    .peak-density-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 10px;
      display: flex;
      pointer-events: none;
      opacity: 0.85;
    }

    .peak-segment {
      height: 100%;
      transition: background-color 0.2s;
    }

    .now-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--danger-color);
      z-index: 15;
      pointer-events: none;
    }

    .now-marker::after {
      content: "NOW";
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--danger-color);
    }

    .timeline-node {
      position: absolute;
      top: 22px;
      transform: translateX(-50%);
      background-color: var(--surface-color);
      border: 1px solid var(--accent-color);
      color: var(--text-primary);
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 0.74rem;
      font-weight: 600;
      white-space: nowrap;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      transition: opacity 0.2s, border-color 0.2s;
    }

    .timeline-node.overdue {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
      opacity: 0.65;
    }

    .timeline-node .node-time {
      display: block;
      font-size: 0.66rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* Interval Pill (65% scale, +10% font, no icon) */
    .interval-pill {
      position: absolute;
      top: 56px;
      transform: translateX(-50%) scale(0.65);
      background-color: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      z-index: 8;
      pointer-events: none;
    }

    .timeline-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .timeline-start-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-now-jump {
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 4px;
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-now-jump:hover {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    /* Card Container (v7.17 Minimalist Collapsible Cards) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 12px;
    }

    .boss-card {
      position: relative;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s, transform 0.1s;
    }

    .boss-card:hover {
      border-color: var(--accent-color);
      background-color: var(--surface-hover);
    }

    .boss-card.expired {
      background-color: var(--expired-bg);
      border-color: var(--expired-border);
      animation: pulseBorder 1.8s infinite;
    }

    @keyframes pulseBorder {
      0%, 100% { border-color: var(--expired-border); }
      50% { border-color: rgba(239, 68, 68, 0.35); }
    }

    .btn-card-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.65;
    }

    .btn-card-close:hover {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger-color);
      opacity: 1;
    }

    .card-summary {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 18px;
    }

    .card-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-times-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .card-target {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .card-remaining {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .boss-card.expired .card-remaining {
      color: var(--danger-color);
    }

    .boss-card.unset .card-remaining {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Expandable Controls inside Card */
    .card-controls {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
      cursor: default;
    }

    .boss-card.expanded .card-controls {
      display: block;
    }

    .hms-inputs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .hms-inputs input {
      width: 100%;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 5px 6px;
      border-radius: 5px;
      font-size: 0.84rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
      user-select: text;
    }

    .hms-inputs input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .card-action-btns {
      display: flex;
      gap: 6px;
    }

    .card-action-btns button {
      flex: 1;
      padding: 5px 6px;
      font-size: 0.78rem;
    }

    /* Toast List (Bottom Right, Auto-height, Max 30 items, No Scrollbar) */
    .toast-container {
      position: fixed;
      bottom: 14px;
      right: 14px;
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      z-index: 9999;
      pointer-events: none;
      max-width: 340px;
    }

    .toast-item {
      background-color: var(--surface-color);
      color: var(--text-primary);
      border-left: 4px solid var(--accent-color);
      border-top: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      box-shadow: var(--shadow);
      animation: slideIn 0.2s ease-out;
      pointer-events: auto;
    }

    .toast-item.success { border-left-color: var(--success-color); }
    .toast-item.warning { border-left-color: var(--warning-color); }
    .toast-item.error { border-left-color: var(--danger-color); }

    @keyframes slideIn {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-section">
      <span class="brand-title">Lander Timer</span>
      <span class="version-badge">v7.17</span>
      <span id="liveClock" class="clock-display">00:00:00</span>
    </div>

    <div class="toolbar-actions">
      <button id="btnAddCard" class="primary">Add Card</button>
      <button id="btnPasteClipboard">Paste Image</button>
      <button id="btnWipeAll" class="danger">Wipe All</button>
      <button id="btnToggleConfig">Settings</button>
      <button id="btnThemeToggle">Light Mode</button>
    </div>
  </div>

  <!-- Collapsible Settings Panel -->
  <div id="configPanel" class="config-panel">
    <div class="config-grid">
      <div class="config-item">
        <label for="cfgGeminiKey">Gemini API Key (gemini-3.1-flash-lite)</label>
        <input type="password" id="cfgGeminiKey" placeholder="AIzaSy..." />
      </div>
      <div class="config-item">
        <label for="cfgFirebaseUrl">Firebase Realtime Database URL</label>
        <input type="text" id="cfgFirebaseUrl" placeholder="https://lander-timer-sync-default-rtdb.asia-southeast1.firebasedatabase.app" />
      </div>
      <div class="config-item">
        <label for="cfgCardsPath">Firebase Cards Path (default: cards)</label>
        <input type="text" id="cfgCardsPath" placeholder="cards" />
      </div>
      <div class="config-item">
        <label for="cfgTgToken">Telegram Bot Token</label>
        <input type="password" id="cfgTgToken" placeholder="123456:ABC-DEF..." />
      </div>
      <div class="config-item">
        <label for="cfgTgChatId">Telegram Chat ID</label>
        <input type="text" id="cfgTgChatId" placeholder="-100123456789" />
      </div>
    </div>
    <div class="config-footer">
      <span class="paste-hint">Tip: Press Ctrl + V anywhere to parse Raidboss screenshot via Gemini AI.</span>
      <button id="btnSaveConfig" class="primary">Save Settings</button>
    </div>
  </div>

  <!-- Interactive Timeline -->
  <div class="timeline-wrapper">
    <div class="timeline-header">
      <span>Timeline (Drag to pan)</span>
      <div class="peak-legend">
        <span>Density:</span>
        <span><i class="legend-dot" style="background:#38bdf8;"></i>1</span>
        <span><i class="legend-dot" style="background:#22c55e;"></i>2</span>
        <span><i class="legend-dot" style="background:#f59e0b;"></i>3</span>
        <span><i class="legend-dot" style="background:#ef4444;"></i>4+</span>
      </div>
    </div>

    <div id="timelineViewport" class="timeline-viewport">
      <div id="peakDensityBar" class="peak-density-bar"></div>
      <div id="nowMarker" class="now-marker"></div>
      <div id="timelineNodesLayer"></div>
    </div>

    <div class="timeline-footer-row">
      <div class="timeline-start-group">
        <span id="timelineStartLabel">--:--</span>
        <button id="btnNowJump" class="btn-now-jump">NOW</button>
      </div>
      <span id="timelineEndLabel">--:--</span>
    </div>
  </div>

  <!-- Cards Grid -->
  <div id="cardContainer" class="card-grid"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script>
    // =========================================================
    // STATE & STORAGE
    // =========================================================
    const DEFAULT_FIREBASE_URL = "https://lander-timer-sync-default-rtdb.asia-southeast1.firebasedatabase.app";
    const STORAGE_KEY_CARDS = "lander_timer_cards_v717";
    const STORAGE_KEY_CFG = "lander_timer_cfg_v717";
    const STORAGE_KEY_THEME = "lander_theme";

    let config = {
      geminiKey: "",
      firebaseUrl: DEFAULT_FIREBASE_URL,
      cardsPath: "cards",
      tgToken: "",
      tgChatId: ""
    };

    let cards = [];
    let expandedCardId = null;
    let lastRenderedOrderSignature = "";
    let db = null;
    let cardsRef = null;
    let isRemoteUpdate = false;

    // Timeline Pan State (6 hours window = 21600000 ms)
    const TIMELINE_WINDOW_MS = 6 * 3600 * 1000;
    let timelineOffsetMs = -30 * 60 * 1000;
    let isDraggingTimeline = false;
    let dragStartX = 0;
    let dragStartOffsetMs = 0;

    // =========================================================
    // INITIALIZATION
    // =========================================================
    function init() {
      loadTheme();
      loadConfig();
      loadLocalCards();
      initFirebase();
      bindEvents();
      render();
      setInterval(tickLoop, 200);
    }

    function loadTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
      if (savedTheme === "light") {
        document.body.classList.add("light-mode");
        document.getElementById("btnThemeToggle").textContent = "Dark Mode";
      }
    }

    function loadConfig() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CFG);
        if (raw) {
          const parsed = JSON.parse(raw);
          config = { ...config, ...parsed };
        }
      } catch (e) {}
      if (!config.firebaseUrl) config.firebaseUrl = DEFAULT_FIREBASE_URL;
      if (!config.cardsPath) config.cardsPath = "cards";

      document.getElementById("cfgGeminiKey").value = config.geminiKey || "";
      document.getElementById("cfgFirebaseUrl").value = config.firebaseUrl;
      document.getElementById("cfgCardsPath").value = config.cardsPath;
      document.getElementById("cfgTgToken").value = config.tgToken || "";
      document.getElementById("cfgTgChatId").value = config.tgChatId || "";
    }

    function loadLocalCards() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CARDS);
        if (raw) {
          cards = JSON.parse(raw);
        }
      } catch (e) {
        cards = [];
      }
      normalizeCards(cards);
    }

    function normalizeCards(list) {
      if (!Array.isArray(list)) return [];
      list.forEach((c, idx) => {
        if (!c.id) c.id = "boss_" + idx + "_" + (c.name || idx);
        if (typeof c.originalIndex !== "number") c.originalIndex = idx;
        if (typeof c.target === "string") c.target = Number(c.target) || null;
        if (c.target === undefined) c.target = null;
      });
      return list;
    }

    // =========================================================
    // FIREBASE SYNC (COMPATIBLE WITH ROOT PATHS & TELEGRAM CONFIG)
    // =========================================================
    function initFirebase() {
      if (!config.firebaseUrl) return;
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp({ databaseURL: config.firebaseUrl });
        }
        db = firebase.database();

        // 1. Auto-load Telegram & Gemini config from Firebase 'telegram_config' if present
        db.ref("telegram_config").on("value", (snap) => {
          const tgVal = snap.val();
          if (!tgVal) return;
          let updated = false;
          if (!config.tgToken && (tgVal.botToken || tgVal.tgToken)) {
            config.tgToken = tgVal.botToken || tgVal.tgToken;
            document.getElementById("cfgTgToken").value = config.tgToken;
            updated = true;
          }
          if (!config.tgChatId && (tgVal.chatId || tgVal.tgChatId)) {
            config.tgChatId = tgVal.chatId || tgVal.tgChatId;
            document.getElementById("cfgTgChatId").value = config.tgChatId;
            updated = true;
          }
          if (!config.geminiKey && (tgVal.geminiKey || tgVal.apiKey)) {
            config.geminiKey = tgVal.geminiKey || tgVal.apiKey;
            document.getElementById("cfgGeminiKey").value = config.geminiKey;
            updated = true;
          }
          if (updated) {
            localStorage.setItem(STORAGE_KEY_CFG, JSON.stringify(config));
          }
        });

        // 2. Listen to main cards path (default 'cards')
        attachCardsListener(config.cardsPath || "cards");

        // 3. Auto-fallback check: if 'cards' is empty on server, check 'timers' node
        db.ref("cards").once("value", (snap) => {
          if (!snap.exists()) {
            db.ref("timers").once("value", (timerSnap) => {
              if (timerSnap.exists() && config.cardsPath === "cards") {
                config.cardsPath = "timers";
                document.getElementById("cfgCardsPath").value = "timers";
                localStorage.setItem(STORAGE_KEY_CFG, JSON.stringify(config));
                attachCardsListener("timers");
              }
            });
          }
        });

      } catch (err) {
        console.error(err);
        showToast("Firebase connection error: " + err.message, "error");
      }
    }

    function attachCardsListener(path) {
      if (cardsRef) cardsRef.off();
      cardsRef = db.ref(path);

      cardsRef.on("value", (snapshot) => {
        const val = snapshot.val();
        if (!val) return;
        isRemoteUpdate = true;
        const arr = Array.isArray(val) ? val.filter(Boolean) : Object.keys(val).map(k => ({ id: k, ...val[k] }));
        cards = normalizeCards(arr);
        localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(cards));
        render();
        isRemoteUpdate = false;
      }, (err) => {
        showToast("Firebase Read Error: " + err.message, "error");
      });
    }

    function saveAndSync() {
      localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(cards));
      if (cardsRef && !isRemoteUpdate) {
        cardsRef.set(cards).catch(err => console.error("Sync error:", err));
      }
    }

    // Unified Notification: Priority 60s alert, single push across all browsers
    function triggerUnifiedNotification(card, remainingSecs) {
      const secsLabel = Math.max(1, Math.ceil(remainingSecs));
      const message = `${card.name}: Sắp đến giờ! (Còn ${secsLabel} giây)`;

      if (cardsRef) {
        const cardIndex = cards.findIndex(c => c.id === card.id);
        if (cardIndex === -1) return;
        const cardNodeRef = cardsRef.child(`${cardIndex}`);

        cardNodeRef.transaction((currentData) => {
          if (!currentData) return currentData;
          if (currentData.warned60s) return; // Abort if another browser already claimed it
          currentData.warned60s = true;
          currentData.warnedDone = true;
          return currentData;
        }, (error, committed) => {
          if (!error && committed) {
            sendTelegramMessage(message);
            showBrowserNotification(message);
          }
        });
      } else {
        card.warned60s = true;
        card.warnedDone = true;
        saveAndSync();
        sendTelegramMessage(message);
        showBrowserNotification(message);
      }
    }

    async function sendTelegramMessage(text) {
      if (!config.tgToken || !config.tgChatId) return;
      try {
        const url = `https://api.telegram.org/bot${config.tgToken}/sendMessage`;
        await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: config.tgChatId,
            text: text
          })
        });
      } catch (e) {
        console.error("Telegram Error:", e);
      }
    }

    function showBrowserNotification(text) {
      showToast(text, "warning");
      if ("Notification" in window) {
        if (Notification.permission === "granted") {
          new Notification("Lander Timer", { body: text });
        } else if (Notification.permission !== "denied") {
          Notification.requestPermission().then(perm => {
            if (perm === "granted") new Notification("Lander Timer", { body: text });
          });
        }
      }
    }

    // =========================================================
    // REAL-TIME SORTING & TIMER LOOP
    // =========================================================
    function getSortedCards(now) {
      return [...cards].sort((a, b) => {
        const aExpired = a.target !== null && a.target <= now;
        const bExpired = b.target !== null && b.target <= now;

        // Expired cards jump to top immediately
        if (aExpired && !bExpired) return -1;
        if (!aExpired && bExpired) return 1;

        // If both expired, sort by earliest target first
        if (aExpired && bExpired) return a.target - b.target;

        // Otherwise return strictly to default originalIndex
        return (a.originalIndex ?? 0) - (b.originalIndex ?? 0);
      });
    }

    function tickLoop() {
      const now = Date.now();
      document.getElementById("liveClock").textContent = formatClockTime(now);

      // Check notifications
      cards.forEach(card => {
        if (!card.target) return;
        const diffMs = card.target - now;
        const diffSecs = diffMs / 1000;

        // Priority 60s alert (single notification per cycle)
        if (diffSecs <= 60 && diffSecs > -15 && !card.warned60s) {
          card.warned60s = true;
          card.warnedDone = true;
          triggerUnifiedNotification(card, diffSecs);
        }
      });

      // Check if card order changed (e.g. a card just expired)
      const sorted = getSortedCards(now);
      const currentSignature = sorted.map(c => `${c.id}:${c.target !== null && c.target <= now ? 1 : 0}`).join("|");

      if (currentSignature !== lastRenderedOrderSignature) {
        const activeEl = document.activeElement;
        const isTyping = activeEl && activeEl.tagName === "INPUT" && activeEl.closest(".boss-card");
        if (!isTyping) {
          render();
          return;
        }
      }

      // Fast text-only update for countdowns & timeline
      updateLiveCountdowns(now);
      renderTimeline(now);
    }

    function updateLiveCountdowns(now) {
      cards.forEach(card => {
        const remEl = document.getElementById(`rem_${card.id}`);
        const cardEl = document.getElementById(`card_${card.id}`);
        if (!remEl || !cardEl) return;

        if (!card.target) {
          remEl.textContent = "--:--:--";
          cardEl.classList.remove("expired");
          cardEl.classList.add("unset");
          return;
        }

        cardEl.classList.remove("unset");
        const diff = card.target - now;

        if (diff <= 0) {
          remEl.textContent = "00:00:00";
          cardEl.classList.add("expired");
        } else {
          remEl.textContent = formatDuration(diff);
          cardEl.classList.remove("expired");
        }
      });
    }

    // =========================================================
    // RENDER & SINGLE-EXPANDED CARD FOCUS LOGIC
    // =========================================================
    function openOrToggleCard(id) {
      if (expandedCardId === id) {
        expandedCardId = null;
        if (document.activeElement) document.activeElement.blur();
        render();
        return;
      }

      // Select new card (automatically collapses previously expanded card)
      expandedCardId = id;
      render();

      // Auto-focus and select Hour input box immediately
      const hInput = document.getElementById(`in_h_${id}`);
      if (hInput) {
        hInput.focus();
        hInput.select();
      }
    }

    function render() {
      const now = Date.now();
      const sorted = getSortedCards(now);
      lastRenderedOrderSignature = sorted.map(c => `${c.id}:${c.target !== null && c.target <= now ? 1 : 0}`).join("|");

      const container = document.getElementById("cardContainer");
      container.innerHTML = "";

      if (sorted.length === 0) {
        container.innerHTML = `<div style="color:var(--text-secondary); font-size:0.85rem; padding:12px;">Syncing data from Firebase... (or click Add Card)</div>`;
        renderTimeline(now);
        return;
      }

      sorted.forEach(card => {
        const isExpired = card.target !== null && card.target <= now;
        const isUnset = card.target === null;
        const isExpanded = expandedCardId === card.id;

        const cardEl = document.createElement("div");
        cardEl.id = `card_${card.id}`;
        cardEl.className = `boss-card ${isExpired ? "expired" : ""} ${isUnset ? "unset" : ""} ${isExpanded ? "expanded" : ""}`;

        const targetStr = card.target ? formatClockTime(card.target) : "--:--:--";
        const remStr = isUnset ? "--:--:--" : (isExpired ? "00:00:00" : formatDuration(card.target - now));

        cardEl.innerHTML = `
          <button type="button" class="btn-card-close" title="Remove card" data-action="delete" data-id="${card.id}">x</button>
          <div class="card-summary" data-action="toggle" data-id="${card.id}">
            <div class="card-name">${escapeHtml(card.name)}</div>
            <div class="card-times-row">
              <span class="card-target">Target: ${targetStr}</span>
              <span id="rem_${card.id}" class="card-remaining">${remStr}</span>
            </div>
          </div>
          <div class="card-controls">
            <div class="hms-inputs">
              <input type="number" min="0" max="99" placeholder="H" id="in_h_${card.id}" />
              <input type="number" min="0" max="59" placeholder="M" id="in_m_${card.id}" />
              <input type="number" min="0" max="59" placeholder="S" id="in_s_${card.id}" />
            </div>
            <div class="card-action-btns">
              <button type="button" class="primary" data-action="set" data-id="${card.id}">Set</button>
              <button type="button" data-action="wipe" data-id="${card.id}">Wipe</button>
              <button type="button" data-action="rename" data-id="${card.id}">Rename</button>
            </div>
          </div>
        `;

        // Handle card click/tap
        cardEl.addEventListener("click", (e) => {
          e.stopPropagation();

          if (e.target.tagName === "INPUT") {
            return;
          }

          const actionBtn = e.target.closest("[data-action]");
          if (actionBtn) {
            const action = actionBtn.getAttribute("data-action");
            const id = actionBtn.getAttribute("data-id");

            if (action === "toggle") {
              openOrToggleCard(id);
            } else if (action === "delete") {
              deleteCard(id);
            } else if (action === "set") {
              setCardTimerFromInputs(id);
            } else if (action === "wipe") {
              wipeCardTimer(id);
            } else if (action === "rename") {
              renameCard(id);
            }
            return;
          }

          if (expandedCardId !== card.id) {
            openOrToggleCard(card.id);
          }
        });

        cardEl.querySelectorAll("input").forEach(inp => {
          inp.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              setCardTimerFromInputs(card.id);
            }
          });
        });

        container.appendChild(cardEl);
      });

      renderTimeline(now);
    }

    // =========================================================
    // CARD ACTIONS
    // =========================================================
    function setCardTimerFromInputs(id) {
      const h = parseInt(document.getElementById(`in_h_${id}`)?.value || "0", 10) || 0;
      const m = parseInt(document.getElementById(`in_m_${id}`)?.value || "0", 10) || 0;
      const s = parseInt(document.getElementById(`in_s_${id}`)?.value || "0", 10) || 0;

      const totalMs = ((h * 3600) + (m * 60) + s) * 1000;
      if (totalMs <= 0) {
        showToast("Enter a valid duration greater than 0", "warning");
        return;
      }

      const card = cards.find(c => c.id === id);
      if (!card) return;

      card.target = Date.now() + totalMs;
      card.warned60s = false;
      card.warnedDone = false;
      expandedCardId = null;
      if (document.activeElement) document.activeElement.blur();

      saveAndSync();
      render();
      showToast(`${card.name} set to ${formatClockTime(card.target)}`, "success");
    }

    function wipeCardTimer(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      card.target = null;
      card.warned60s = false;
      card.warnedDone = false;
      expandedCardId = null;
      if (document.activeElement) document.activeElement.blur();

      saveAndSync();
      render();
      showToast(`Wiped ${card.name}`, "info");
    }

    function renameCard(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      const newName = prompt("Enter new Boss name:", card.name);
      if (newName && newName.trim()) {
        card.name = newName.trim();
        saveAndSync();
        render();
      }
    }

    function deleteCard(id) {
      const card = cards.find(c => c.id === id);
      if (!card) return;
      if (!confirm(`Delete "${card.name}"?`)) return;
      cards = cards.filter(c => c.id !== id);
      cards.forEach((c, idx) => c.originalIndex = idx);
      if (expandedCardId === id) expandedCardId = null;
      saveAndSync();
      render();
    }

    // =========================================================
    // TIMELINE RENDERING & PEAK DENSITY
    // =========================================================
    function renderTimeline(now) {
      const viewport = document.getElementById("timelineViewport");
      const nodesLayer = document.getElementById("timelineNodesLayer");
      const nowMarker = document.getElementById("nowMarker");
      const peakBar = document.getElementById("peakDensityBar");

      const viewStart = now + timelineOffsetMs;
      const viewEnd = viewStart + TIMELINE_WINDOW_MS;

      document.getElementById("timelineStartLabel").textContent = formatShortTime(viewStart);
      document.getElementById("timelineEndLabel").textContent = formatShortTime(viewEnd);

      const nowPct = ((now - viewStart) / TIMELINE_WINDOW_MS) * 100;
      if (nowPct >= 0 && nowPct <= 100) {
        nowMarker.style.display = "block";
        nowMarker.style.left = `${nowPct}%`;
      } else {
        nowMarker.style.display = "none";
      }

      const sixtyFiveMinsMs = 65 * 60 * 1000;
      const activeNodes = cards
        .filter(c => c.target !== null && (now - c.target) <= sixtyFiveMinsMs)
        .sort((a, b) => a.target - b.target);

      nodesLayer.innerHTML = "";
      const viewportWidth = viewport.clientWidth || 800;

      activeNodes.forEach((card, idx) => {
        const pct = ((card.target - viewStart) / TIMELINE_WINDOW_MS) * 100;
        if (pct >= -10 && pct <= 110) {
          const isOverdue = card.target <= now;
          const node = document.createElement("div");
          node.className = `timeline-node ${isOverdue ? "overdue" : ""}`;
          node.style.left = `${pct}%`;
          node.innerHTML = `${escapeHtml(card.name)}<span class="node-time">${formatShortTime(card.target)}</span>`;
          nodesLayer.appendChild(node);
        }

        if (idx < activeNodes.length - 1) {
          const nextCard = activeNodes[idx + 1];
          const midTime = (card.target + nextCard.target) / 2;
          const midPct = ((midTime - viewStart) / TIMELINE_WINDOW_MS) * 100;
          const gapPx = ((nextCard.target - card.target) / TIMELINE_WINDOW_MS) * viewportWidth;

          if (midPct >= 0 && midPct <= 100 && gapPx >= 52) {
            const gapMs = nextCard.target - card.target;
            const gapMins = Math.round(gapMs / 60000);
            const h = Math.floor(gapMins / 60);
            const m = gapMins % 60;
            const gapLabel = h > 0 ? `${h}h${m > 0 ? m + "m" : ""}` : `${m}m`;

            const pill = document.createElement("div");
            pill.className = "interval-pill";
            pill.style.left = `${midPct}%`;
            pill.textContent = gapLabel;
            nodesLayer.appendChild(pill);
          }
        }
      });

      const buckets = 24;
      const bucketMs = TIMELINE_WINDOW_MS / buckets;
      let peakHtml = "";

      for (let i = 0; i < buckets; i++) {
        const bStart = viewStart + i * bucketMs;
        const bEnd = bStart + bucketMs;
        const count = activeNodes.filter(c => c.target >= bStart && c.target < bEnd).length;

        let color = "transparent";
        if (count === 1) color = "#38bdf8";
        else if (count === 2) color = "#22c55e";
        else if (count === 3) color = "#f59e0b";
        else if (count >= 4) color = "#ef4444";

        peakHtml += `<div class="peak-segment" style="flex:1; background:${color};"></div>`;
      }
      peakBar.innerHTML = peakHtml;
    }

    // =========================================================
    // AI CLIPBOARD OCR (GEMINI DATA - API LATENCY - 15s)
    // =========================================================
    const AI_PROMPT = `Extract all Raidboss names and their remaining respawn countdown timers from this screenshot.
Return ONLY a valid JSON array with objects having keys: "name" (string), "hours" (number), "minutes" (number), "seconds" (number).
If a boss has no timer or is already alive/spawned, omit it or set hours/minutes/seconds to 0.
Example: [{"name": "Fafurion", "hours": 1, "minutes": 42, "seconds": 15}]`;

    async function handleImageBlob(blob) {
      if (!config.geminiKey) {
        showToast("Please configure Gemini API Key in Settings first", "warning");
        document.getElementById("configPanel").classList.add("open");
        return;
      }

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Data = reader.result.split(",")[1];
        await parseAiDataAndSync(base64Data, blob.type || "image/png");
      };
      reader.readAsDataURL(blob);
    }

    async function parseAiDataAndSync(base64Image, mimeType) {
      const apiStartTime = Date.now();
      showToast("Analyzing clipboard image via Gemini 3.1 Flash Lite...", "info");

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${encodeURIComponent(config.geminiKey)}`;
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: AI_PROMPT },
                { inline_data: { mime_type: mimeType, data: base64Image } }
              ]
            }]
          })
        });

        if (!response.ok) {
          const errBody = await response.text();
          throw new Error(`HTTP ${response.status}: ${errBody.slice(0, 80)}`);
        }

        const data = await response.json();
        const apiEndTime = Date.now();

        // Remaining time = Gemini API data - API latency - 15s
        const apiLatencyMs = apiEndTime - apiStartTime;
        const fixedCaptureOffsetMs = 15 * 1000;
        const totalSubtractedSecs = ((apiLatencyMs + fixedCaptureOffsetMs) / 1000).toFixed(1);

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "[]";
        const jsonMatch = rawText.match(/\[[\s\S]*\]/);
        const cleanedJson = jsonMatch ? jsonMatch[0] : "[]";
        const parsedList = JSON.parse(cleanedJson);

        let updatedCount = 0;

        parsedList.forEach(item => {
          if (!item || !item.name) return;
          const h = Number(item.hours) || 0;
          const m = Number(item.minutes) || 0;
          const s = Number(item.seconds) || 0;

          if (h === 0 && m === 0 && s === 0) return;

          const matchedCard = cards.find(c =>
            c.name.trim().toLowerCase() === item.name.trim().toLowerCase()
          );

          if (matchedCard) {
            const rawRemainingMs = ((h * 3600) + (m * 60) + s) * 1000;
            const adjustedRemainingMs = Math.max(0, rawRemainingMs - apiLatencyMs - fixedCaptureOffsetMs);

            matchedCard.target = apiEndTime + adjustedRemainingMs;
            matchedCard.warned60s = false;
            matchedCard.warnedDone = false;
            updatedCount++;
          }
        });

        if (updatedCount > 0) {
          saveAndSync();
          render();
          showToast(`Updated ${updatedCount} Boss(es) (-${totalSubtractedSecs}s)`, "success");
        } else {
          showToast("No matching Boss timers found", "warning");
        }
      } catch (err) {
        console.error("AI Parse Error:", err);
        showToast(`AI Error: ${err.message}`, "error");
      }
    }

    // =========================================================
    // UI EVENTS & HELPERS
    // =========================================================
    function bindEvents() {
      // Collapse active card & blur focus when clicking/tapping outside the selected card
      document.addEventListener("click", (e) => {
        if (!expandedCardId) return;

        const clickedCard = e.target.closest(".boss-card");
        if (!clickedCard || clickedCard.id !== `card_${expandedCardId}`) {
          expandedCardId = null;
          if (document.activeElement) {
            document.activeElement.blur();
          }
          render();
        }
      });

      // Global Ctrl+V Paste listener
      window.addEventListener("paste", (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("image") !== -1) {
            const blob = items[i].getAsFile();
            if (blob) handleImageBlob(blob);
            break;
          }
        }
      });

      // Manual Paste Button
      document.getElementById("btnPasteClipboard").addEventListener("click", async () => {
        try {
          const clipboardItems = await navigator.clipboard.read();
          for (const item of clipboardItems) {
            const imageType = item.types.find(t => t.startsWith("image/"));
            if (imageType) {
              const blob = await item.getType(imageType);
              await handleImageBlob(blob);
              return;
            }
          }
          showToast("No image found in clipboard", "warning");
        } catch (err) {
          showToast("Press Ctrl + V directly on the page to paste image", "info");
        }
      });

      // Add Card
      document.getElementById("btnAddCard").addEventListener("click", () => {
        const name = prompt("Enter Boss name:");
        if (!name || !name.trim()) return;
        cards.push({
          id: "boss_" + Date.now(),
          name: name.trim(),
          target: null,
          originalIndex: cards.length,
          warned60s: false,
          warnedDone: false
        });
        saveAndSync();
        render();
        showToast(`Added ${name.trim()}`, "success");
      });

      // Wipe All
      document.getElementById("btnWipeAll").addEventListener("click", () => {
        if (!confirm("Wipe all active timers?")) return;
        cards.forEach(c => {
          c.target = null;
          c.warned60s = false;
          c.warnedDone = false;
        });
        expandedCardId = null;
        if (document.activeElement) document.activeElement.blur();
        saveAndSync();
        render();
        showToast("All timers wiped", "info");
      });

      // Toggle Settings
      document.getElementById("btnToggleConfig").addEventListener("click", () => {
        document.getElementById("configPanel").classList.toggle("open");
      });

      // Save Settings
      document.getElementById("btnSaveConfig").addEventListener("click", () => {
        config.geminiKey = document.getElementById("cfgGeminiKey").value.trim();
        config.firebaseUrl = document.getElementById("cfgFirebaseUrl").value.trim() || DEFAULT_FIREBASE_URL;
        config.cardsPath = document.getElementById("cfgCardsPath").value.trim() || "cards";
        config.tgToken = document.getElementById("cfgTgToken").value.trim();
        config.tgChatId = document.getElementById("cfgTgChatId").value.trim();

        localStorage.setItem(STORAGE_KEY_CFG, JSON.stringify(config));
        document.getElementById("configPanel").classList.remove("open");
        showToast("Settings saved", "success");
        initFirebase();
      });

      // Theme Toggle
      document.getElementById("btnThemeToggle").addEventListener("click", () => {
        const isLight = document.body.classList.toggle("light-mode");
        localStorage.setItem(STORAGE_KEY_THEME, isLight ? "light" : "dark");
        document.getElementById("btnThemeToggle").textContent = isLight ? "Dark Mode" : "Light Mode";
      });

      // NOW Jump Button
      document.getElementById("btnNowJump").addEventListener("click", () => {
        timelineOffsetMs = -30 * 60 * 1000;
        renderTimeline(Date.now());
      });

      // Timeline Drag-to-Pan
      const viewport = document.getElementById("timelineViewport");
      viewport.addEventListener("mousedown", (e) => {
        isDraggingTimeline = true;
        dragStartX = e.clientX;
        dragStartOffsetMs = timelineOffsetMs;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDraggingTimeline) return;
        const dx = e.clientX - dragStartX;
        const width = viewport.clientWidth || 800;
        const deltaMs = -(dx / width) * TIMELINE_WINDOW_MS;
        timelineOffsetMs = dragStartOffsetMs + deltaMs;
        renderTimeline(Date.now());
      });

      window.addEventListener("mouseup", () => {
        isDraggingTimeline = false;
      });

      // Touch support for Timeline Drag
      viewport.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          isDraggingTimeline = true;
          dragStartX = e.touches[0].clientX;
          dragStartOffsetMs = timelineOffsetMs;
        }
      }, { passive: true });

      viewport.addEventListener("touchmove", (e) => {
        if (!isDraggingTimeline || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - dragStartX;
        const width = viewport.clientWidth || 800;
        const deltaMs = -(dx / width) * TIMELINE_WINDOW_MS;
        timelineOffsetMs = dragStartOffsetMs + deltaMs;
        renderTimeline(Date.now());
      }, { passive: true });

      viewport.addEventListener("touchend", () => {
        isDraggingTimeline = false;
      });
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      const item = document.createElement("div");
      item.className = `toast-item ${type}`;
      item.textContent = message;
      container.prepend(item);

      while (container.children.length > 30) {
        container.removeChild(container.lastChild);
      }

      setTimeout(() => {
        if (item.parentNode) item.remove();
      }, 6500);
    }

    function formatClockTime(ts) {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }

    function formatShortTime(ts) {
      const d = new Date(ts);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    function formatDuration(ms) {
      const totalSecs = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Start Application
    init();
  </script>
</body>
