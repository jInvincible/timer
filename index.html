<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lander Timer Web v7.18</title>
  <!-- Firebase SDK v9 Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --surface-color: #1e293b;
      --surface-hover: #273549;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --success-color: #22c55e;
      --warning-color: #f59e0b;
      --expired-bg: rgba(239, 68, 68, 0.14);
      --expired-border: #ef4444;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --surface-color: #ffffff;
      --surface-hover: #f8fafc;
      --border-color: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #dc2626;
      --danger-hover: #b91c1c;
      --success-color: #16a34a;
      --warning-color: #d97706;
      --expired-bg: rgba(220, 38, 38, 0.08);
      --expired-border: #dc2626;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 16px 20px 60px;
      transition: background-color 0.2s, color 0.2s;
      user-select: none;
    }

    /* Header & Toolbar */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-section {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .version-badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-color);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .clock-display {
      font-variant-numeric: tabular-nums;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button {
      background-color: var(--surface-color);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent-color);
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    button.primary:hover {
      background-color: var(--accent-hover);
    }

    button.danger {
      color: var(--danger-color);
      border-color: rgba(239, 68, 68, 0.4);
    }

    button.danger:hover {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    /* Config Drawer */
    .config-panel {
      display: none;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .config-panel.open {
      display: block;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .config-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-item label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .config-item input {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      user-select: text;
    }

    .config-footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .paste-hint {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* Timeline Section */
    .timeline-wrapper {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    .peak-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
    }

    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 3px;
    }

    .timeline-viewport {
      position: relative;
      width: 100%;
      height: 88px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      cursor: grab;
    }

    .timeline-viewport:active {
      cursor: grabbing;
    }

    .peak-density-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 10px;
      display: flex;
      pointer-events: none;
      opacity: 0.85;
    }

    .peak-segment {
      height: 100%;
      transition: background-color 0.2s;
    }

    .now-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--danger-color);
      z-index: 15;
      pointer-events: none;
    }

    .now-marker::after {
      content: "NOW";
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--danger-color);
    }

    .timeline-node {
      position: absolute;
      top: 22px;
      transform: translateX(-50%);
      background-color: var(--surface-color);
      border: 1px solid var(--accent-color);
      color: var(--text-primary);
      padding: 3px 7px;
      border-radius: 5px;
      font-size: 0.74rem;
      font-weight: 600;
      white-space: nowrap;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      transition: opacity 0.2s, border-color 0.2s;
    }

    .timeline-node.overdue {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
      opacity: 0.65;
    }

    .timeline-node .node-time {
      display: block;
      font-size: 0.66rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    /* Interval Pill (65% scale, +10% font, no icon) */
    .interval-pill {
      position: absolute;
      top: 56px;
      transform: translateX(-50%) scale(0.65);
      background-color: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      z-index: 8;
      pointer-events: none;
    }

    .timeline-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .timeline-start-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-now-jump {
      padding: 2px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 4px;
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-now-jump:hover {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    /* Card Container (v7.17 Minimalist Collapsible Cards) */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 12px;
    }

    .boss-card {
      position: relative;
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s, transform 0.1s;
    }

    .boss-card:hover {
      border-color: var(--accent-color);
      background-color
